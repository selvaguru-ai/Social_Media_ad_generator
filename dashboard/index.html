<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>pipeline console — prospect to pitch</title>
    <meta
      name="description"
      content="Review scored leads, competitor ad intel, and approve drafted outreach for the prospect-to-pitch pipeline."
    />
    <link rel="icon" href="/favicon.svg?v=lumen-night" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/tokens.css?v=lumen-night" />
    <link rel="stylesheet" href="/assets/app.css?v=lumen-night" />
  </head>
  <body>
    <!-- One icon set, one stroke voice: 24px grid, 1.6 stroke, round caps. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute" focusable="false">
      <defs>
        <g
          id="i-base"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></g>
      </defs>
      <symbol id="i-overview" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20h18" />
          <path d="M6 20V12" />
          <path d="M11 20V7" />
          <path d="M16 20v-5" />
          <path d="M21 20V4" />
        </g>
      </symbol>
      <symbol id="i-leads" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5" />
          <circle cx="12" cy="12" r="4" />
          <path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2" />
        </g>
      </symbol>
      <symbol id="i-market" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" />
          <path d="M7.8 16.2a6 6 0 0 1 0-8.4" />
          <path d="M16.2 7.8a6 6 0 0 1 0 8.4" />
          <path d="M4.9 19.1a10 10 0 0 1 0-14.2" />
          <path d="M19.1 4.9a10 10 0 0 1 0 14.2" />
        </g>
      </symbol>
      <symbol id="i-approvals" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h13a2 2 0 0 1 2 2v5" />
          <path d="M3.5 7.5v9a2 2 0 0 0 2 2h7" />
          <path d="m3.9 6.6 8.1 5.6 8.1-5.6" />
          <path d="m15.5 17.5 2 2 4-4.5" />
        </g>
      </symbol>
      <symbol id="i-runs" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 7.5V12l3 2" />
        </g>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6.5" />
          <path d="m16 16 4 4" />
        </g>
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </g>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 6 12 12M18 6 6 18" />
        </g>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="m4.5 12.5 5 5 10-11" />
        </g>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4.5 21 19.5H3L12 4.5Z" />
          <path d="M12 10v4" />
          <path d="M12 17h.01" />
        </g>
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 5h5v5" />
          <path d="M19 5l-7.5 7.5" />
          <path d="M18 14.5V18a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 18V7.5A1.5 1.5 0 0 1 6 6h3.5" />
        </g>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 5.5 18 12 8 18.5V5.5Z" />
        </g>
      </symbol>
      <symbol id="i-empty" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5v-7Z" />
          <path d="M4 8.5 12 13l8-4.5M12 13v7" />
        </g>
      </symbol>
    </svg>

    <div class="shell">
      <header class="topbar">
        <span class="wordmark"><span class="wordmark__mark">/</span>pipeline</span>
        <div style="display: flex; gap: var(--space-xs)">
          <button
            class="btn btn--sm btn--icon"
            type="button"
            data-action="open-palette"
            aria-label="Open command palette"
          >
            <svg width="16" height="16" aria-hidden="true"><use href="#i-search" /></svg>
          </button>
          <button
            class="btn btn--sm btn--icon"
            type="button"
            data-action="toggle-rail"
            aria-expanded="false"
            aria-controls="nav-sheet"
            aria-label="Open navigation"
          >
            <svg width="16" height="16" aria-hidden="true"><use href="#i-menu" /></svg>
          </button>
        </div>
      </header>

      <!-- N5 floating pill. Content-sized, detached, solid paper — no blur. -->
      <nav class="nav-pill" id="nav-pill" aria-label="Sections">
        <span class="wordmark"><span class="wordmark__mark">/</span>pipeline</span>
        <div class="nav-pill__links" id="rail-nav"></div>
        <button class="kbd-chip" type="button" data-action="open-palette">
          jump
          <kbd>⌘K</kbd>
        </button>
      </nav>

      <nav class="nav-sheet" id="nav-sheet" data-open="false" aria-label="Sections">
        <div id="sheet-nav"></div>
      </nav>

      <main class="main">
        <div class="view" id="view" aria-live="polite" aria-busy="true">
          <div class="stack">
            <div class="skeleton skeleton--half"></div>
            <div class="skeleton skeleton--wide"></div>
            <div class="skeleton skeleton--wide"></div>
          </div>
        </div>
        <footer class="statusline" id="statusline"></footer>
      </main>
    </div>

    <dialog class="palette" id="palette" aria-label="Command palette">
      <div class="palette__field">
        <input
          class="palette__input"
          id="palette-input"
          type="text"
          placeholder="Search sections, leads, drafts…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="palette__list" id="palette-list" role="listbox" aria-label="Results"></div>
      <div class="palette__foot">
        <span>↑↓ move</span><span>↵ open</span><span>esc close</span>
      </div>
    </dialog>

    <dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
      <div class="drawer__head">
        <div class="page-head">
          <span class="tag" id="drawer-tag"></span>
          <h2 id="drawer-title"></h2>
        </div>
        <button class="btn btn--sm btn--icon" type="button" data-action="close-drawer" aria-label="Close">
          <svg width="16" height="16" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="drawer__body" id="drawer-body"></div>
    </dialog>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="/assets/app.js?v=lumen-night" type="module"></script>
  </body>
</html>
